<style>

<script>
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1;
var INK='#231409';
var FONT='"Chalkboard SE","Comic Sans MS","Marker Felt","Trebuchet MS",system-ui,sans-serif';
var PAL={
 cat:'#cf8330', catHi:'#eba552', catDark:'#9c5a17', earIn:'#dd9d92', muzzle:'#f7e7c9',
 nose:'#c04a3d', gunWood:'#8a5a30', gunMetal:'#6e6e78', gunDark:'#3c3c46', gem:'#e2a52a', gemDark:'#bf7f1c'
};
var MICE=[
 {body:'#7fa05a',belly:'#a8c47f',inner:'#d8a89c'},
 {body:'#c9a83f',belly:'#e3d18a',inner:'#d8a89c'},
 {body:'#c98243',belly:'#e6c19a',inner:'#d8a89c'},
 {body:'#b45a3c',belly:'#d99a7a',inner:'#d8a89c'},
 {body:'#f4ecdd',belly:'#fffaf0',inner:'#d8a89c'}
];
var bgCanvas=document.createElement('canvas'),vigCanvas=document.createElement('canvas'),menuBgCanvas=document.createElement('canvas'),menuSceneCanvas=document.createElement('canvas');
var menuCX=0,menuCY=0,menuR=120;

function rrPath(c,x,y,w,h,r){
 r=Math.min(r,w/2,h/2);
 c.beginPath();
 c.moveTo(x+r,y);
 c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);
 c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);
 c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);
 c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);
 c.closePath();
}
function ink(w){ctx.strokeStyle=INK;ctx.lineWidth=w;ctx.lineJoin='round';ctx.lineCap='round'}
function oell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);ctx.fill();ctx.stroke()}
function clamp(v,a,b){return v<a?a:v>b?b:v}

function prep(cv){
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 var c=cv.getContext('2d');
 c.setTransform(DPR,0,0,DPR,0,0);
 return c;
}
function buildBackgrounds(){
 var g=prep(bgCanvas);
 g.fillStyle='#d3ba91';g.fillRect(0,0,W,H);
 var gs=46,x,y;
 g.strokeStyle='rgba(122,92,58,.13)';g.lineWidth=1;
 for(x=0;x<W;x+=gs){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,H);g.stroke()}
 for(y=0;y<H;y+=gs){g.beginPath();g.moveTo(0,y+.5);g.lineTo(W,y+.5);g.stroke()}
 g.strokeStyle='rgba(122,92,58,.22)';
 for(x=0;x<W;x+=gs*4){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,H);g.stroke()}
 for(y=0;y<H;y+=gs*4){g.beginPath();g.moveTo(0,y+.5);g.lineTo(W,y+.5);g.stroke()}
 var rg=g.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.8);
 rg.addColorStop(0,'rgba(255,242,208,.34)');rg.addColorStop(1,'rgba(255,242,208,0)');
 g.fillStyle=rg;g.fillRect(0,0,W,H);

 var v=prep(vigCanvas);
 var vg=v.createRadialGradient(W/2,H/2,Math.min(W,H)*.26,W/2,H/2,Math.max(W,H)*.72);
 vg.addColorStop(0,'rgba(56,34,16,0)');vg.addColorStop(.62,'rgba(56,34,16,.20)');vg.addColorStop(1,'rgba(56,34,16,.60)');
 v.fillStyle=vg;v.fillRect(0,0,W,H);

 var m=prep(menuBgCanvas);
 m.fillStyle='#241b14';m.fillRect(0,0,W,H);
 var mg=m.createRadialGradient(W/2,H*.42,0,W/2,H*.42,Math.max(W,H)*.62);
 mg.addColorStop(0,'rgba(158,104,52,.26)');mg.addColorStop(.55,'rgba(74,48,26,.30)');mg.addColorStop(1,'rgba(16,10,6,.92)');
 m.fillStyle=mg;m.fillRect(0,0,W,H);
}
function resize(){
 DPR=Math.min(window.devicePixelRatio||1,2);
 W=window.innerWidth;H=window.innerHeight;
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);
 layoutMenu();
 buildBackgrounds();
 buildMenuScene();
}
function layoutMenu(){
 menuR=Math.max(78,Math.min(W*.38,H*.30,236));
 menuCX=W/2;
 menuCY=clamp(H*.47,menuR*1.36+26,H-menuR*1.62);
}
function buildMenuScene(){
 var c=prep(menuSceneCanvas);
 var R=menuR,cx=menuCX,cy=menuCY;
 c.beginPath();c.arc(cx,cy,R-1,0,Math.PI*2);c.clip();
 c.fillStyle='#cbb088';c.fillRect(cx-R-2,cy-R-2,R*2+4,R*2+4);
 var g=c.createRadialGradient(cx,cy-R*.28,R*.08,cx,cy,R*1.12);
 g.addColorStop(0,'#dcc7a1');g.addColorStop(.55,'#cdb28a');g.addColorStop(1,'#b2946a');
 c.fillStyle=g;c.fillRect(cx-R-2,cy-R-2,R*2+4,R*2+4);
 c.fillStyle='#ad8f5e';
 c.beginPath();c.ellipse(cx,cy+R*.74,R*1.2,R*.47,0,0,Math.PI*2);c.fill();
 c.fillStyle='#9b7e4f';
 c.beginPath();c.ellipse(cx,cy+R*.86,R*1.2,R*.34,0,0,Math.PI*2);c.fill();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,180)});

// ===== AUDIO =====
var actx=null,musicGain,sfxGain,musicTimer,EVENTS=[],spb=.4,LOOPBEATS=64,evIdx=0,evBase=0,musicOn=false;
var NF=(function(){var N={C:0,D:2,E:4,F:5,G:7,A:9,B:11};return function(s){var m=/^([A-G])(#?)(-?\d)$/.exec(s);return 440*Math.pow(2,(((+m[3]+1)*12+N[m[1]]+(m[2]?1:0))-69)/12)}})();
function addVoice(a,w,v,att){var b=0;for(var i=0;i<a.length;i++){var n=a[i];if(n[0]!=='-')EVENTS.push({b:b,f:NF(n[0]),d:n[1]*.92,w:w,v:v,at:att});b+=n[1]}}
var CHORDS=[['C4','E4','G4'],['C4','E4','G4'],['B3','D4','G4'],['B3','D4','G4'],['A3','C4','E4'],['A3','C4','E4'],['A3','C4','F4'],['B3','D4','G4'],['C4','E4','G4'],['C4','E4','G4'],['B3','D4','G4'],['B3','D4','G4'],['A3','C4','E4'],['A3','C4','F4'],['B3','D4','G4'],['C4','E4','G4']];
var MEL=[['E4',.75],['G4',.25],['C5',1],['B4',.5],['A4',.5],['G4',1],['E4',.5],['G4',.5],['C5',.5],['D5',.5],['E5',1],['D5',1],['D5',.5],['B4',.5],['G4',1],['B4',.5],['D5',.5],['G5',1],['F5',.5],['E5',.5],['D5',1],['B4',.5],['G4',.5],['D5',1],['A4',.5],['C5',.5],['E5',1],['D5',.5],['C5',.5],['A4',1],['E5',.5],['C5',.5],['A4',1],['B4',.5],['C5',.5],['B4',1],['A4',.5],['C5',.5],['F5',1],['E5',.5],['D5',.5],['C5',1],['B4',.5],['D5',.5],['G5',1],['F5',.5],['E5',.5],['D5',1],['C5',.5],['E5',.5],['G5',1],['E5',.5],['C5',.5],['G4',1],['G4',.5],['C5',.5],['E5',1],['D5',.5],['C5',.5],['B4',1],['B4',.5],['D5',.5],['G5',1],['D5',.5],['B4',.5],['G4',1],['G4',.5],['B4',.5],['D5',1],['E5',.5],['D5',.5],['B4',1],['A4',.5],['C5',.5],['E5',1],['G5',.5],['E5',.5],['C5',1],['F4',.5],['A4',.5],['C5',1],['E5',.5],['C5',.5],['A4',1],['D5',.5],['G5',.5],['B5',1],['A5',.5],['G5',.5],['D5',1],['C5',1],['E5',1],['G5',2]];
var HARM=[['C4',1],['E4',1],['G4',.5],['F4',.5],['E4',1],['C4',1],['E4',1],['G4',.5],['G4',.5],['F4',1],['B3',1],['D4',1],['G4',1],['D4',1],['A3',1],['C4',1],['D4',1],['B3',1],['A3',1],['C4',1],['E4',1],['C4',1],['A3',1],['C4',1],['E4',.5],['D4',.5],['C4',1],['F3',1],['A3',1],['C4',1],['A3',1],['G3',1],['B3',1],['D4',1],['B3',1],['C4',1],['E4',1],['G4',1],['E4',1],['C4',1],['E4',1],['G4',.5],['F4',.5],['E4',1],['D4',1],['G4',1],['B4',1],['G4',1],['D4',1],['G4',1],['B4',.5],['A4',.5],['G4',1],['A3',1],['C4',1],['E4',1],['C4',1],['F3',1],['A3',1],['C4',1],['A3',1],['D4',1],['G4',1],['B4',1],['G4',1],['C4',1],['E4',1],['G4',2]];
var BASS=[['C3',2],['G2',2],['C3',2],['G2',2],['G2',2],['D3',2],['G2',2],['B2',2],['A2',2],['E3',2],['A2',2],['C3',2],['F2',2],['C3',2],['G2',2],['D3',2],['C3',2],['G2',2],['C3',2],['E3',2],['G2',2],['D3',2],['G2',2],['B2',2],['A2',2],['E3',2],['F2',2],['A2',2],['G2',2],['D3',2],['C3',2],['G2',2]];
function buildScore(){
 EVENTS=[];
 addVoice(MEL,'square',.05,.012);
 addVoice(HARM,'triangle',.035,.012);
 addVoice(BASS,'triangle',.09,.012);
 var P=[0,1,2,1,0,2,1,2];
 for(var i=0;i<CHORDS.length;i++){
  var ch=CHORDS[i],bb=i*4,j;
  for(j=0;j<3;j++)EVENTS.push({b:bb,f:NF(ch[j]),d:3.6,w:'triangle',v:.016,at:.3});
  for(j=0;j<8;j++)EVENTS.push({b:bb+j*.5,f:NF(ch[P[j]])*2,d:.42,w:'square',v:.022,at:.005});
 }
 EVENTS.sort(function(a,b){return a.b-b.b});
}
function initAudio(){
 if(actx){if(actx.state==='suspended')actx.resume();return}
 actx=new(window.AudioContext||window.webkitAudioContext)();
 musicGain=actx.createGain();musicGain.gain.value=.5;musicGain.connect(actx.destination);
 sfxGain=actx.createGain();sfxGain.gain.value=.5;sfxGain.connect(actx.destination);
 if(actx.state==='suspended')actx.resume();
 buildScore();startMusic();
}
function startMusic(){
 if(musicTimer)clearInterval(musicTimer);
 musicOn=true;evIdx=0;evBase=actx.currentTime+.12;
 musicTimer=setInterval(scheduler,50);
}
function scheduler(){
 if(!musicOn||!actx||actx.state!=='running')return;
 var look=actx.currentTime+.6;
 while(evIdx<EVENTS.length){var e=EVENTS[evIdx],t=evBase+e.b*spb;if(t>look)break;playNote(e,t);evIdx++}
 if(evIdx>=EVENTS.length){evBase+=LOOPBEATS*spb;evIdx=0}
}
function playNote(e,t){
 var o=actx.createOscillator(),g=actx.createGain(),d=e.d*spb;
 o.type=e.w;o.frequency.value=e.f;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(e.v,t+(e.at||.01));g.gain.exponentialRampToValueAtTime(.0008,t+d);
 o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+d+.03);
}
function melody(seq,dur,vol,gap){
 var n=actx.currentTime;
 for(var i=0;i<seq.length;i++){
  var t=n+i*gap,o=actx.createOscillator(),g=actx.createGain();
  o.type='triangle';o.frequency.value=seq[i];
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+dur+.02);
 }
}
function playSound(type){
 if(!actx)return;
 var n=actx.currentTime;
 function tone(w,f1,f2,dur,vol,delay){
  var t=n+(delay||0),o=actx.createOscillator(),g=actx.createGain();
  o.type=w;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+dur+.02);
 }
 if(type==='shoot')tone('square',900,320,.07,.06);
 else if(type==='hit')tone('triangle',420,150,.05,.045);
 else if(type==='bonus'){tone('sine',880,1320,.08,.06);tone('sine',1320,1760,.09,.045,.055)}
 else if(type==='kill')tone('sawtooth',300,80,.1,.05);
 else if(type==='damage')tone('sawtooth',220,60,.18,.09);
 else if(type==='boss')tone('sawtooth',90,35,.5,.12);
 else if(type==='start')melody([523,659,784,1047],.16,.07,.09);
 else if(type==='levelup')melody([523,659,784,1047],.2,.07,.07);
 else if(type==='gameover'||type==='death')melody([440,370,311,262],.35,.08,.15);
}

// ===== GAME STATE =====
var state='menu';
var gameTime=0,kills=0,lastSpawn=0,lastBoss=0,shake=0,lastFrame=0,bossCount=0;
var player={x:0,y:0,r:14,hp:100,maxHp:100,speed:3.5,atkSpeed:.5,lastShot:0,damage:5,bulletSpeed:7,
 bulletCount:1,pierce:0,critChance:.05,critMult:2,magnetRange:60,regen:0,level:1,xp:0,xpNext:5,invuln:0,
 vx:0,vy:0,face:-Math.PI/2,lean:0,recoil:0,step:0};
var enemies=[],bullets=[],gems=[],particles=[],floatTexts=[],dusts=[],pops=[];
var touchX=null,touchY=null;
var megaBossSpawned=false;

function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}

function spawnParticles(x,y,color,count){
 for(var i=0;i<count;i++){
  if(particles.length>80)break;
  var a=Math.random()*Math.PI*2,s=1+Math.random()*3;
  particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:color,size:1+Math.random()*2});
 }
}
function addFloatText(x,y,text,color){
 if(floatTexts.length>25)floatTexts.shift();
 floatTexts.push({x:x,y:y,text:text,color:color,life:1,vy:-1.2});
}
function spawnDust(x,y,amt){
 if(dusts.length>70)return;
 var a=Math.random()*Math.PI*2,s=.6+Math.random()*1.2;
 dusts.push({x:x+(Math.random()-.5)*10,y:y+(Math.random()-.5)*10,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,size:2+Math.random()*3.5});
}
function spawnPop(x,y,c,kind){
 if(pops.length>18)return;
 pops.push({x:x,y:y,life:1,c:c||'#9c3f18',kind:kind||'kill',r:Math.random()*6.28});
}

function getSpawnInterval(){
 if(gameTime<15)return 3.0;
 if(gameTime<30)return 2.3;
 if(gameTime<60)return 1.6;
 if(gameTime<120)return 1.1;
 if(gameTime<180)return .8;
 if(gameTime<300)return .55;
 return .45;
}
function getMaxEnemies(){
 if(gameTime<15)return 5;
 if(gameTime<30)return 8;
 if(gameTime<60)return 14;
 if(gameTime<120)return 22;
 if(gameTime<180)return 32;
 if(gameTime<300)return 45;
 return 55;
}

function spawnEnemy(isBoss,isMega){
 var side=Math.floor(Math.random()*4),m=35,x,y;
 if(side===0){x=Math.random()*W;y=-m}
 else if(side===1){x=W+m;y=Math.random()*H}
 else if(side===2){x=Math.random()*W;y=H+m}
 else{x=-m;y=Math.random()*H}
 if(isMega){
  bossCount++;
  var bs=1+(bossCount-1)*0.05;
  var bHp=(300+gameTime*1.2)*bs;
  enemies.push({x:x,y:y,r:40,hp:bHp,maxHp:bHp,speed:.5,damage:25*bs,isBoss:true,isMega:true,shootTimer:0,colorTier:4,bossScale:bs});
  playSound('boss');
 }else if(isBoss){
  bossCount++;
  var bs2=1+(bossCount-1)*0.05;
  var bHp2=(80+gameTime*.5)*bs2;
  enemies.push({x:x,y:y,r:26,hp:bHp2,maxHp:bHp2,speed:.8,damage:15*bs2,isBoss:true,shootTimer:0,colorTier:4,bossScale:bs2});
  playSound('boss');
 }else{
  var t=Math.random(),e;
  if(t<.45){
   e={x:x,y:y,r:11,hp:8+gameTime*.18,speed:1.2,damage:5,isBoss:false,colorTier:0};
  }else if(t<.7){
   e={x:x,y:y,r:10,hp:12+gameTime*.2,speed:1.5,damage:6,isBoss:false,colorTier:1};
  }else if(t<.88){
   e={x:x,y:y,r:12,hp:18+gameTime*.28,speed:1.0,damage:8,isBoss:false,colorTier:2};
  }else if(t<.96){
   e={x:x,y:y,r:13,hp:28+gameTime*.35,speed:.85,damage:10,isBoss:false,colorTier:3};
  }else{
   e={x:x,y:y,r:14,hp:45+gameTime*.5,speed:1.1,damage:14,isBoss:false,colorTier:4};
  }
  e.maxHp=e.hp;
  enemies.push(e);
 }
}

function shoot(time){
 if(time-player.lastShot<player.atkSpeed)return;
 player.lastShot=time;
 var nearest=null,nd=Infinity;
 for(var i=0;i<enemies.length;i++){
  var d=dist(player,enemies[i]);
  if(d<nd){nd=d;nearest=enemies[i]}
 }
 if(!nearest)return;
 var a=Math.atan2(nearest.y-player.y,nearest.x-player.x);
 var spread=player.bulletCount>1?.2:0;
 for(var i=0;i<player.bulletCount;i++){
  var off=player.bulletCount>1?(i/(player.bulletCount-1)-.5)*spread:0;
  var ang=a+off;
  var crit=Math.random()<player.critChance;
  bullets.push({x:player.x,y:player.y,vx:Math.cos(ang)*player.bulletSpeed,vy:Math.sin(ang)*player.bulletSpeed,
   damage:crit?player.damage*player.critMult:player.damage,isCrit:crit,pierce:player.pierce,life:2,isEnemy:false});
 }
 player.recoil=1;
 spawnPop(player.x+Math.cos(a)*24,player.y+Math.sin(a)*24,'#e07a1e','flash');
 playSound('shoot');
}

function levelUp(){

   ch.appendChild(d);
  })(shuffled[i]);
 }

}

var _mTemp={x:0,y:0};
function update(dt,time){
 var f60=dt*60;
 // ---- CAT: cartoon inertia movement ----
 var tvx=0,tvy=0,moving=false;
 if(touchX!==null&&touchY!==null){
  var dx=touchX-player.x,dy=touchY-player.y,d=Math.sqrt(dx*dx+dy*dy);
  if(d>5){tvx=dx/d*player.speed*60;tvy=dy/d*player.speed*60;moving=true}
 }
 var curV=Math.sqrt(player.vx*player.vx+player.vy*player.vy);
 var tgtV=Math.sqrt(tvx*tvx+tvy*tvy);
 // punchy acceleration, slippery braking -> "занос"
 var lam=(tgtV>curV)?15:6.5;
 var k=1-Math.exp(-lam*dt);
 player.vx+=(tvx-player.vx)*k;
 player.vy+=(tvy-player.vy)*k;
 if(!moving&&curV<3){player.vx*=.7;player.vy*=.7}
 player.x+=player.vx*dt;
 player.y+=player.vy*dt;
 if(player.x<player.r){player.x=player.r;player.vx=0}
 if(player.x>W-player.r){player.x=W-player.r;player.vx=0}
 if(player.y<player.r){player.y=player.r;player.vy=0}
 if(player.y>H-player.r){player.y=H-player.r;player.vy=0}
 // facing: aim at nearest, else movement dir
 var nnear=null,nnd=Infinity;
 for(var i=0;i<enemies.length;i++){
  var dd=dist(player,enemies[i]);if(dd<nnd){nnd=dd;nnear=enemies[i]}
 }
 var wantFace=nnear?Math.atan2(nnear.y-player.y,nnear.x-player.x):(curV>8?Math.atan2(player.vy,player.vx):player.face);
 var fd=wantFace-player.face;
 while(fd>Math.PI)fd-=Math.PI*2;while(fd<-Math.PI)fd+=Math.PI*2;
 player.face+=fd*Math.min(1,dt*14);
 // lateral lean (занос) from velocity vs facing
 var perp=Math.cos(player.face)*player.vy-Math.sin(player.face)*player.vx;
 player.lean+=(clamp(perp/(player.speed*60*1.2),-1,1)*.5-player.lean)*Math.min(1,dt*8);
 player.recoil=Math.max(0,player.recoil-dt*6);
 player.step+=dt*(6+9*Math.min(1,curV/(player.speed*60+1)));
 if(player.regen>0&&player.hp<player.maxHp)player.hp=Math.min(player.maxHp,player.hp+player.regen*dt);
 if(player.invuln>0)player.invuln-=dt;
 shoot(time);
 // Spawn
 if(time-lastSpawn>getSpawnInterval()&&enemies.length<getMaxEnemies()){
  spawnEnemy(false);lastSpawn=time;
 }
 if(time-lastBoss>90){spawnEnemy(true);lastBoss=time}
 if(player.level>0&&player.level%10===0&&!megaBossSpawned){
  spawnEnemy(false,true);megaBossSpawned=true;
 }
 if(player.level%10!==0)megaBossSpawned=false;
 // Enemies
 for(var i=enemies.length-1;i>=0;i--){
  var e=enemies[i];
  var dx=player.x-e.x,dy=player.y-e.y,d=Math.sqrt(dx*dx+dy*dy);
  if(e.angle===undefined){
   e.angle=Math.atan2(dy,dx);e.ph=Math.random()*6.28;e.jphase=Math.random()*6.28;
   e.turnT=Math.random()*.4;e.lean=0;e.turnRate=e.isBoss?2.4:3.6+Math.random()*2.2;
  }
  if(d>1){
   var base=Math.atan2(dy,dx);
   e.jphase+=dt*(2.6+(e.colorTier||0)*.55);
   e.turnT-=dt;
   if(e.turnT<=0){e.jphase+=(Math.random()-.5)*5.5;e.turnT=.32+Math.random()*.7}
   var jit=(Math.sin(e.jphase)*.62+Math.sin(e.jphase*2.3+1.7)*.34)*(e.isBoss?.32:1);
   var des=base+jit;
   var dif=des-e.angle;
   while(dif>Math.PI)dif-=Math.PI*2;while(dif<-Math.PI)dif+=Math.PI*2;
   var step=clamp(dif,-e.turnRate*dt,e.turnRate*dt);
   e.angle+=step;
   // skid dust on sharp turns
   if(Math.abs(dif)>.55&&Math.random()<.5)spawnDust(e.x-Math.cos(e.angle)*e.r,e.y-Math.sin(e.angle)*e.r);
   e.lean+=(clamp(dif,-1,1)*.45-e.lean)*Math.min(1,dt*9);
   var sp=e.speed*60*1.08*dt;
   e.x+=Math.cos(e.angle)*sp;
   e.y+=Math.sin(e.angle)*sp;
   e.step=(e.step||0)+dt*(16+(e.colorTier||0));
  }
  if(e.isBoss){
   e.shootTimer+=dt;
   if(e.shootTimer>2){
    e.shootTimer=0;
    for(var j=0;j<8;j++){
     var a=(j/8)*Math.PI*2;
     bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,damage:8*(e.bossScale||1),isCrit:false,pierce:0,life:3,isEnemy:true});
    }
   }
  }
  if(d<e.r+player.r&&player.invuln<=0){
   player.hp-=e.damage;player.invuln=.7;shake=8;playSound('damage');
   spawnParticles(player.x,player.y,'#d4693f',6);
   if(player.hp<=0){player.hp=0;state='gameover';playSound('gameover');showGameOver()}
  }
 }
 // Bullets
 for(var i=bullets.length-1;i>=0;i--){
  var b=bullets[i];
  b.x+=b.vx;b.y+=b.vy;b.life-=dt;
  if(b.life<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){bullets.splice(i,1);continue}
  if(b.isEnemy){
   if(dist(b,player)<player.r+4&&player.invuln<=0){
    player.hp-=b.damage;player.invuln=.5;shake=5;playSound('damage');bullets.splice(i,1);
    if(player.hp<=0){player.hp=0;state='gameover';playSound('gameover');showGameOver()}
   }
   continue;
  }
  for(var j=enemies.length-1;j>=0;j--){
   var e=enemies[j];
   if(dist(b,e)<e.r+4){
    e.hp-=b.damage;
    addFloatText(e.x,e.y-e.r,Math.floor(b.damage),b.isCrit?'#ffd85e':'#fdf3e0');
    spawnParticles(b.x,b.y,b.isCrit?'#e8b04a':'#d4894a',b.isCrit?5:2);
    playSound('hit');
    if(e.hp<=0){
     spawnParticles(e.x,e.y,'#c9a877',7);playSound('kill');kills++;
     spawnPop(e.x,e.y,'#9c3f18','kill');
     var gemMult=e.isBoss?(e.bossScale||1):1;
     gems.push({x:e.x,y:e.y,r:5,value:e.isBoss?Math.round(10*gemMult):1});
     if(e.isBoss)for(var k=0;k<5;k++)gems.push({x:e.x+(Math.random()-.5)*30,y:e.y+(Math.random()-.5)*30,r:5,value:Math.round(2*gemMult)});
     enemies.splice(j,1);
    }
    if(b.pierce>0)b.pierce--;else{bullets.splice(i,1);break}
   }
  }
 }
 // Gems
 for(var i=gems.length-1;i>=0;i--){
  var g=gems[i],dx=player.x-g.x,dy=player.y-g.y,d=Math.sqrt(dx*dx+dy*dy);
  if(d<player.magnetRange){g.x+=dx/d*4;g.y+=dy/d*4}
  if(d<player.r+g.r){
   player.xp+=g.value;gems.splice(i,1);playSound('bonus');
   if(player.xp>=player.xpNext){
    player.xp-=player.xpNext;player.level++;player.xpNext=Math.floor(player.xpNext*1.4);levelUp();
   }
  }
 }
 // Particles
 for(var i=particles.length-1;i>=0;i--){
  var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;p.life-=dt*2;
  if(p.life<=0)particles.splice(i,1);
 }
 // Dust
 for(var i=dusts.length-1;i>=0;i--){
  var p=dusts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.93;p.vy*=.93;p.size+=dt*7;p.life-=dt*1.9;
  if(p.life<=0)dusts.splice(i,1);
 }
 // Pops
 for(var i=pops.length-1;i>=0;i--){
  var p=pops[i];p.life-=dt*(p.kind==='flash'?7:3.2);
  if(p.life<=0)pops.splice(i,1);
 }
 // Float texts
 for(var i=floatTexts.length-1;i>=0;i--){
  var f=floatTexts[i];f.y+=f.vy;f.life-=dt*1.5;
  if(f.life<=0)floatTexts.splice(i,1);
 }
 if(shake>0){shake*=.9;if(shake<.1)shake=0}
}

function drawPop(p){
 var f=p.kind==='flash';
 var k=1-p.life;
 var r=(f?4:9)+k*(f?14:30);
 ctx.save();
 ctx.globalAlpha=Math.max(0,p.life);
 ctx.strokeStyle=f?'#ffd27a':p.c;
 ctx.lineWidth=f?3:4;
 ctx.lineCap='round';
 ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.stroke();
 var n=f?5:7;
 for(var i=0;i<n;i++){
  var a=p.r+i*(Math.PI*2/n);
  var r1=r+2,r2=r+ (f?7:13)*(1-k*.4);
  ctx.beginPath();ctx.moveTo(p.x+Math.cos(a)*r1,p.y+Math.sin(a)*r1);
  ctx.lineTo(p.x+Math.cos(a)*r2,p.y+Math.sin(a)*r2);ctx.stroke();
 }
 ctx.restore();
}

function draw(t){
 ctx.globalAlpha=1;
 ctx.drawImage(bgCanvas,0,0,W,H);
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 // gems
 for(var i=0;i<gems.length;i++)drawGem(gems[i],t);
 // dust
 for(var i=0;i<dusts.length;i++){
  var p=dusts[i];
  ctx.globalAlpha=p.life*.38;
  ctx.fillStyle='#8a7047';
  ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 // bullets
 for(var i=0;i<bullets.length;i++)drawBullet(bullets[i]);
 // enemies
 for(var i=0;i<enemies.length;i++)drawEnemy(enemies[i],t);
 // particles
 for(var i=0;i<particles.length;i++){
  var p=particles[i];
  ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 // cat
 ctx.save();
 if(player.invuln>0&&Math.floor(player.invuln*20)%2)ctx.globalAlpha=.45;
 drawCat(t);
 ctx.restore();
 ctx.globalAlpha=1;
 // pops
 for(var i=0;i<pops.length;i++)drawPop(pops[i]);
 // float texts
 ctx.font='900 15px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
 for(var i=0;i<floatTexts.length;i++){
  var f2=floatTexts[i];
  ctx.globalAlpha=Math.max(0,f2.life);
  ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.lineJoin='round';
  ctx.strokeText(f2.text,f2.x,f2.y);
  ctx.fillStyle=f2.color;ctx.fillText(f2.text,f2.x,f2.y);
 }
 ctx.globalAlpha=1;
 ctx.restore();
 ctx.drawImage(vigCanvas,0,0,W,H);
 // HUD
 document.getElementById('lvl').textContent=player.level;
 document.getElementById('time').textContent=Math.floor(gameTime);
 document.getElementById('kills').textContent=kills;
 document.getElementById('hp-fill').style.width=(player.hp/player.maxHp*100)+'%';
 document.getElementById('xp-fill').style.width=(player.xp/player.xpNext*100)+'%';
}

}

function loop(ts){
 var now=ts/1000;
 var dt=Math.min(.05,now-lastFrame);
 lastFrame=now;
 if(state==='playing'){gameTime+=dt;update(dt,now);draw(now)}
 else if(state==='paused'||state==='levelup'||state==='gameover')draw(now);
 else{drawMenu(now)}
 requestAnimationFrame(loop);
}

 return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;

 if(state!=='playing')return;
 touchX=t.clientX;touchY=t.clientY;
},{passive:false});

},{passive:false});

});

  if(el.requestFullscreen)el.requestFullscreen();

function showGameOver(){
 var ov=document.getElementById('overlay');
 ov.innerHTML='<h1>Игра окончена</h1><p>Время: '+Math.floor(gameTime)+' сек &nbsp;•&nbsp; Мышей: '+kills+' &nbsp;•&nbsp; Уровень: '+player.level+'</p><button id="restart-btn">ЗАНОВО</button>';
 ov.style.display='flex';
 document.getElementById('restart-btn').addEventListener('click',function(){
  var el=document.documentElement;
  try{
   if(el.requestFullscreen)el.requestFullscreen();
   else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
  }catch(err){}
  startGame();
 });
}

document.addEventListener('visibilitychange',function(){
 if(document.hidden&&state==='playing')state='paused';
 else if(!document.hidden&&state==='paused'){state='playing';lastFrame=performance.now()/1000}
});

resize();
requestAnimationFrame(loop);
